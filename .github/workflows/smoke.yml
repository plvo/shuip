name: Consumer smoke test

on:
  pull_request:
    branches:
      - main
    paths:
      - "packages/registry/**"
      - "packages/ui/**"
      - "apps/docs/scripts/**"
      - ".github/workflows/smoke.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  radix:
    name: "🔌 Install & type-check (radix-vega)"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: "📥 Checkout Code"
        uses: actions/checkout@v4

      - name: "🔧 Setup Bun Runtime"
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: "🗄️ Cache Bun Packages"
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: "📦 Install Dependencies"
        run: bun install

      - name: "🔌 Smoke Test"
        run: bun run smoke radix-vega

  base:
    name: "🔌 Install & type-check (base-vega)"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: "📥 Checkout Code"
        uses: actions/checkout@v4

      - name: "🔧 Setup Bun Runtime"
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: "🗄️ Cache Bun Packages"
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: "📦 Install Dependencies"
        run: bun install

      - name: "🔌 Smoke Test"
        run: bun run smoke base-vega
